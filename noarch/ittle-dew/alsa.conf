# Minimal ALSA config for Ittle Dew: only expose PipeWire's default device.
# The game's old FMOD crashes while enumerating the full system device list.
pcm.!default {
    type pipewire
    playback_node "-1"
    capture_node  "-1"
    hint {
        show on
        description "PipeWire"
    }
}
ctl.!default {
    type pipewire
}
